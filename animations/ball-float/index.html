<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>圓球落水與浮力平衡｜科學動畫</title><style>body{margin:0;background:#0b1220;color:#eef5ff;font:18px/1.7 system-ui,"Microsoft JhengHei",sans-serif}main{max-width:1000px;margin:auto;padding:24px}a{color:#67dbe9}video{width:100%;background:#000;border-radius:12px}section{background:#162236;padding:20px;border-radius:12px;margin-top:20px}h1{font-size:clamp(25px,4vw,36px)}button{font:inherit;background:#67dbe9;border:0;border-radius:8px;padding:8px 16px;cursor:pointer}select{font:inherit;padding:7px;margin:8px}small{display:block;color:#b8c9df}</style></head><body><main><a href="../../">回科學動畫首頁</a><h1>圓球落水與浮力平衡</h1><p>觀察圓球落水、上浮，最後浮在水面上的過程。</p><video id="film" controls playsinline preload="metadata"><source src="ball_float_extended.mp4" type="video/mp4">您的瀏覽器無法播放影片，請下載觀看。</video><p><button id="replay" type="button">重新播放</button> <label>播放速度<select id="speed"><option value="0.5">0.5 倍</option><option value="1" selected>正常</option><option value="1.5">1.5 倍</option></select></label> <a href="ball_float_extended.mp4" download>下載 MP4</a></p><section><h2>教學重點</h2><p>球最後浮在水面上，靜止時浮力與重力平衡。</p><p>球入水後，受浮力、重力與水的阻力影響，可能先下沉再上浮，逐漸穩定。以水的密度為 1.0 g/cm³、球的平均密度為 0.8 g/cm³ 為例，平衡時應有約 80% 的球體體積浸在水中。</p><small>影片為 AI 生成示意；畫面中的浸水比例、箭頭長度、刻度與公式排版不宜作為定量依據。浮力為水的密度 × 排開水的體積 × 重力加速度。</small><h2>觀察與討論</h2><p>球向上移動時，是否一定代表浮力大於重力？球停止後，為什麼不會繼續上升？</p></section></main><script>const film=document.querySelector('#film');document.querySelector('#replay').onclick=()=>{film.currentTime=0;film.play().catch(()=>{})};document.querySelector('#speed').onchange=e=>{film.playbackRate=Number(e.target.value)};</script></body></html>
