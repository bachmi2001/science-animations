<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三角形內角和 180°</title><style>body{font-family:system-ui,'Microsoft JhengHei',sans-serif;background:#f3f8fc;color:#17354b;max-width:850px;margin:25px auto;padding:20px}a{color:#086b84}.panel{background:white;padding:20px;border-radius:16px;box-shadow:0 4px 22px #1232}svg{width:100%;max-height:400px}button{padding:10px 15px;margin:5px;border:0;border-radius:9px;background:#0b6e83;color:white;cursor:pointer}.info{font-size:1.2rem;font-weight:700}</style></head><body><a href="../index.html">← 返回動畫目錄</a><h1>三角形內角和 180°</h1><p>拖動三個頂點，觀察三角形的形狀與內角如何改變。</p><div class="panel"><svg id="svg" viewBox="0 0 600 340" role="img" aria-label="可拖曳三角形"><polygon id="tri" fill="#80cbd4" fill-opacity=".45" stroke="#176f88" stroke-width="3"/><g id="dots"></g><g id="labels" font-size="18" fill="#17354b" font-weight="bold"></g></svg><p id="angles" class="info"></p><p>無論如何拖曳，只要三點不共線，三角形內角總和都等於 180°。</p><button id="reset">重設三角形</button></div><script>const svg=document.querySelector('#svg'),poly=document.querySelector('#tri'),dots=document.querySelector('#dots'),labels=document.querySelector('#labels'),out=document.querySelector('#angles');let pts=[[100,270],[300,50],[500,270]],drag=-1;function angle(a,b,c){let u=[a[0]-b[0],a[1]-b[1]],v=[c[0]-b[0],c[1]-b[1]],dot=u[0]*v[0]+u[1]*v[1],m=Math.hypot(...u)*Math.hypot(...v);return Math.acos(Math.max(-1,Math.min(1,dot/m)))*180/Math.PI}function render(){poly.setAttribute('points',pts.map(p=>p.join(',')).join(' '));dots.replaceChildren();labels.replaceChildren();pts.forEach((p,i)=>{let c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',p[0]);c.setAttribute('cy',p[1]);c.setAttribute('r',11);c.setAttribute('fill','#0b6e83');c.style.cursor='grab';c.addEventListener('pointerdown',e=>{drag=i;c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag!==i)return;const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const t=pt.matrixTransform(svg.getScreenCTM().inverse());const next=[Math.max(15,Math.min(585,t.x)),Math.max(15,Math.min(325,t.y))];const test=pts.map((v,j)=>j===i?next:v);const area=Math.abs((test[1][0]-test[0][0])*(test[2][1]-test[0][1])-(test[2][0]-test[0][0])*(test[1][1]-test[0][1]));if(area>1200){pts[i]=next;render()}});c.addEventListener('pointerup',()=>drag=-1);c.addEventListener('pointercancel',()=>drag=-1);dots.append(c);let t=document.createElementNS('http://www.w3.org/2000/svg','text');t.textContent='ABC'[i];t.setAttribute('x',p[0]+14);t.setAttribute('y',p[1]-14);labels.append(t)});let a=angle(pts[1],pts[0],pts[2]),b=angle(pts[0],pts[1],pts[2]),c=angle(pts[0],pts[2],pts[1]);out.textContent=`∠A ${a.toFixed(1)}° ＋ ∠B ${b.toFixed(1)}° ＋ ∠C ${c.toFixed(1)}° ＝ ${(a+b+c).toFixed(1)}°`}document.querySelector('#reset').onclick=()=>{pts=[[100,270],[300,50],[500,270]];render()};render()</script></body></html>
