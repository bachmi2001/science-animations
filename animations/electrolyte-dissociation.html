<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>酸鹼鹽電解質解離互動動畫</title><style>body{margin:0;font-family:system-ui,'Microsoft JhengHei',sans-serif;background:#eef5fb;color:#17324d}header{background:#163b63;color:white;padding:20px;text-align:center}h1{margin:0;font-size:27px}main{max-width:1050px;margin:20px auto;padding:0 16px}.panel{background:white;border-radius:16px;padding:18px;margin-bottom:15px;box-shadow:0 5px 20px #17324d15}.tabs,.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center}button,select{font:inherit;border:1px solid #a9bfd2;border-radius:9px;padding:10px 14px;background:white;cursor:pointer}button.active{background:#1764aa;color:white;border-color:#1764aa}button:hover{filter:brightness(.95)}label{display:flex;align-items:center;gap:8px}input{accent-color:#1764aa}canvas{width:100%;height:410px;border-radius:12px;background:#e1f5ff;display:block}.eq{font-size:23px;font-weight:700;text-align:center;min-height:40px}.info{line-height:1.8}.legend{display:flex;gap:20px;flex-wrap:wrap}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px}.pos{background:#e65c52}.neg{background:#367acb}.neutral{background:#8b76b6}.small{font-size:13px;color:#536d83}footer{text-align:center;padding:15px;color:#61798c}@media(max-width:600px){canvas{height:350px}.eq{font-size:18px}}</style></head><body><header><h1>💧 酸、鹼、鹽：電解質在水中的解離</h1><div>互動式粒子模型｜國中自然科學</div></header><main><section class="panel"><div class="tabs" id="tabs"><button data-cat="acid" class="active">酸 Acid</button><button data-cat="base">鹼 Base</button><button data-cat="salt">鹽 Salt</button></div><div class="controls" style="margin-top:12px"><label>選擇物質 <select id="substance"></select></label><button id="play">▶ 開始解離</button><button id="pause">⏸ 暫停</button><button id="reset">↻ 重播</button><label>速度 <input id="speed" type="range" min="0.3" max="2.5" step="0.1" value="1"></label><label><input id="water" type="checkbox" checked>顯示水分子</label></div></section><section class="panel"><div class="eq" id="equation"></div><canvas id="scene"></canvas><div class="legend" style="margin-top:12px"><span><i class="dot pos"></i>正離子</span><span><i class="dot neg"></i>負離子</span><span><i class="dot neutral"></i>未電離／未解離粒子</span><span>💧 水分子（示意）</span></div><p class="small">此為概念動畫，粒子大小、數量與運動速度不代表真實微觀尺度。水合方向以示意方式呈現。</p></section><section class="panel info"><strong id="heading"></strong><div id="description"></div><div id="count"></div></section></main><footer>可離線開啟的單一 HTML 教學網頁</footer><script>
const substances={acid:[{name:'鹽酸 HCl',eq:'HCl + H₂O → H₃O⁺ + Cl⁻',formula:'HCl',ions:[['H₃O⁺',1],['Cl⁻',-1]],rate:1,note:'HCl 是強酸，在水中幾乎完全電離。H⁺ 會與水分子結合，形成 H₃O⁺。'},{name:'醋酸 CH₃COOH',eq:'CH₃COOH + H₂O ⇌ H₃O⁺ + CH₃COO⁻',formula:'CH₃COOH',ions:[['H₃O⁺',1],['CH₃COO⁻',-1]],rate:.22,note:'醋酸是弱酸，只有部分分子電離，未電離分子與離子共存，形成動態平衡。'}],base:[{name:'氫氧化鈉 NaOH',eq:'NaOH → Na⁺ + OH⁻',formula:'NaOH',ions:[['Na⁺',1],['OH⁻',-1]],rate:1,note:'NaOH 是強鹼、離子化合物，在水中溶解並解離為 Na⁺ 和 OH⁻。'},{name:'氫氧化鈣 Ca(OH)₂',eq:'Ca(OH)₂ → Ca²⁺ + 2OH⁻',formula:'Ca(OH)₂',ions:[['Ca²⁺',2],['OH⁻',-1],['OH⁻',-1]],rate:1,note:'已溶解的 Ca(OH)₂ 幾乎完全解離；每個化學式單位產生一個 Ca²⁺ 與兩個 OH⁻。注意其在水中的溶解度有限。'}],salt:[{name:'氯化鈉 NaCl',eq:'NaCl → Na⁺ + Cl⁻',formula:'NaCl',ions:[['Na⁺',1],['Cl⁻',-1]],rate:1,note:'NaCl 是離子化合物，晶體溶解時，原有的 Na⁺ 與 Cl⁻ 分散到水中並受到水分子包圍。'},{name:'氯化鈣 CaCl₂',eq:'CaCl₂ → Ca²⁺ + 2Cl⁻',formula:'CaCl₂',ions:[['Ca²⁺',2],['Cl⁻',-1],['Cl⁻',-1]],rate:1,note:'CaCl₂ 溶於水時，一個化學式單位形成一個 Ca²⁺ 與兩個 Cl⁻，總電荷仍為零。'}]};
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');let cat='acid',idx=0,particles=[],waters=[],playing=false,elapsed=0,last=0,speed=1,showWater=true;const N=12;
function current(){return substances[cat][idx]}function fit(){let r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}function dims(){return {w:canvas.clientWidth,h:canvas.clientHeight}}function rand(a,b){return a+Math.random()*(b-a)}
function reset(){particles=[];waters=[];elapsed=0;playing=false;let {w,h}=dims(),s=current();for(let i=0;i<N;i++){let x=rand(w*.23,w*.77),y=rand(h*.25,h*.75);particles.push({x,y,vx:rand(-.22,.22),vy:rand(-.22,.22),label:s.formula,charge:0,group:i,split:false,willSplit:Math.random()<s.rate,at:rand(.5,5.2),r:22})}for(let i=0;i<48;i++)waters.push({x:rand(12,w-12),y:rand(12,h-12),vx:rand(-.22,.22),vy:rand(-.22,.22),angle:rand(0,6.28)});updateCount();draw()}
function split(p){let s=current();p.split=true;p.hidden=true;let {w,h}=dims();for(let [label,charge] of s.ions){let a=rand(0,6.28);particles.push({x:p.x+Math.cos(a)*14,y:p.y+Math.sin(a)*14,vx:Math.cos(a)*rand(.45,.9),vy:Math.sin(a)*rand(.45,.9),label,charge,group:p.group,split:true,r:label.length>5?23:20})}}
function move(p,dt,w,h){p.x+=p.vx*dt*speed;p.y+=p.vy*dt*speed;let m=32;if(p.x<m||p.x>w-m)p.vx*=-1;if(p.y<m||p.y>h-m)p.vy*=-1;p.x=Math.max(m,Math.min(w-m,p.x));p.y=Math.max(m,Math.min(h-m,p.y))}
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function draw(){let {w,h}=dims();ctx.clearRect(0,0,w,h);let grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#ecfaff');grad.addColorStop(1,'#bce8f9');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);ctx.fillStyle='#366a87';ctx.font='14px system-ui';ctx.fillText('水溶液（微觀示意）',16,24);if(showWater)for(let a of waters){ctx.save();ctx.translate(a.x,a.y);ctx.rotate(a.angle);circle(0,0,7,'#b1dcf5');circle(-7,5,3.6,'#ffffff');circle(7,5,3.6,'#ffffff');ctx.restore()}for(let p of particles){if(p.hidden)continue;let fill=p.charge>0?'#e65c52':p.charge<0?'#367acb':'#8b76b6';ctx.shadowColor='#234a6a33';ctx.shadowBlur=8;circle(p.x,p.y,p.r,fill);ctx.shadowBlur=0;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='white';ctx.font=`bold ${p.label.length>6?10:p.label.length>4?12:14}px system-ui`;ctx.fillText(p.label,p.x,p.y);if(showWater&&p.charge!==0){for(let k=0;k<4;k++){let a=k*Math.PI/2+elapsed*.12,dx=Math.cos(a)*33,dy=Math.sin(a)*33;ctx.save();ctx.translate(p.x+dx,p.y+dy);ctx.rotate(a+(p.charge>0?Math.PI:0));circle(-4,0,3.4,'#ffffff');circle(4,0,3.4,'#ffffff');circle(0,4,6,'#84bfe5');ctx.restore()}}}ctx.textAlign='left';ctx.textBaseline='alphabetic'}
function updateCount(){let base=particles.filter(p=>!p.hidden&&p.charge===0).length,ions=particles.filter(p=>!p.hidden&&p.charge!==0).length;document.getElementById('count').textContent=`目前示意：未解離／未電離粒子 ${base} 個；自由離子 ${ions} 個。`}
function tick(t){if(!last)last=t;let dt=Math.min((t-last)/16.67,3);last=t;if(playing){elapsed+=dt*.01667*speed;let {w,h}=dims();for(let p of [...particles]){if(p.hidden)continue;if(!p.split&&p.willSplit&&elapsed>p.at)split(p);else move(p,dt,w,h)}for(let a of waters){a.x+=a.vx*dt*speed;a.y+=a.vy*dt*speed;a.angle+=.004*dt;if(a.x<8||a.x>w-8)a.vx*=-1;if(a.y<8||a.y>h-8)a.vy*=-1}updateCount()}draw();requestAnimationFrame(tick)}
function render(){let sel=document.getElementById('substance');sel.innerHTML='';substances[cat].forEach((s,i)=>{let o=document.createElement('option');o.value=i;o.textContent=s.name;sel.append(o)});sel.value=idx;let s=current();document.getElementById('equation').textContent=s.eq;document.getElementById('heading').textContent=s.name;document.getElementById('description').textContent=s.note;reset()}
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;idx=0;document.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x===b));render()});document.getElementById('substance').onchange=e=>{idx=+e.target.value;render()};document.getElementById('play').onclick=()=>playing=true;document.getElementById('pause').onclick=()=>playing=false;document.getElementById('reset').onclick=()=>{reset();playing=true};document.getElementById('speed').oninput=e=>speed=+e.target.value;document.getElementById('water').onchange=e=>showWater=e.target.checked;window.addEventListener('resize',()=>{fit();reset()});fit();render();requestAnimationFrame(tick);
</script></body></html>
